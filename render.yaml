# =====================================================================
#  AI GTM OS - Render Blueprint (FREE TIER)
#  Render Dashboard -> New -> Blueprint -> pick this repo.
#
#  IMPORTANT: service names are globally unique on Render and they decide
#  your URLs (<name>.onrender.com). If a name is taken, rename it here AND
#  update the four env vars marked  # <-- URL  below.
#
#  No Celery worker and no Redis: both need a paid plan. With REDIS_URL
#  unset the backend flips CELERY_TASK_ALWAYS_EAGER on and runs agent jobs
#  inline on the request, which is why gunicorn gets --timeout 120.
# =====================================================================

databases:
  - name: gtm-db
    databaseName: gtm
    user: gtm
    plan: free          # NOTE: Render deletes free Postgres after 30 days (see README)

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: gtm-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py seed_demo
    # 1 worker: the free instance only has 512MB RAM.
    # --timeout 120 matches GROQ_TIMEOUT, since LLM calls run inline here.
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render generates a strong secret for you
      - key: DATABASE_URL
        fromDatabase:
          name: gtm-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://gtm-web.onrender.com          # <-- URL (frontend)
      - key: CSRF_TRUSTED_ORIGINS
        value: https://gtm-web.onrender.com          # <-- URL (frontend)
      - key: PUBLIC_APP_URL
        value: https://gtm-web.onrender.com          # <-- URL (frontend)
      - key: PUBLIC_API_URL
        value: https://gtm-api.onrender.com          # <-- URL (this service)
      # Prompted for on first deploy; sync:false keeps them out of git.
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      # Free Groq keys are rate-limited; keep the cheap worker model for bulk work.
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_WORKER_MODEL
        value: llama-3.1-8b-instant

  # ------------------------------------------------------------ Frontend
  # Static sites are free on Render and never spin down.
  - type: web
    name: gtm-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://gtm-api.onrender.com/api      # <-- URL (api + /api)
      - key: VITE_APP_NAME
        value: AI GTM OS
    routes:
      - type: rewrite      # SPA: let react-router handle deep links
        source: /*
        destination: /index.html
